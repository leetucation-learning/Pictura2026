<div class="app">
  <div id="canvas">
    <main id="stage" aria-live="off"></main>
    <div id="capband" aria-hidden="true"><p id="cap"></p></div>
    <nav id="bar" aria-label="Comenzile cursului">
      <button class="cb" id="bToc" title="Cuprins" aria-label="Cuprins"><svg><use href="#i-menu"/></svg><span class="lb-t">Cuprins</span></button>
      <button class="cb" id="bWs" title="Fișa de lucru a modulului" aria-label="Fișa de lucru a modulului"><svg><use href="#i-ws"/></svg><span class="lb-t">Fișa</span></button>
      <span class="sep"></span>
      <button class="cb" id="bPlay" title="Pornește vocea" aria-label="Pornește vocea"><svg><use href="#i-play"/></svg></button>
      <button class="cb" id="bReplay" title="Ascultă din nou ecranul" aria-label="Ascultă din nou ecranul"><svg><use href="#i-replay"/></svg></button>
      <button class="cb" id="bAll" title="Arată tot ecranul acum" aria-label="Arată tot ecranul acum"><svg><use href="#i-all"/></svg></button>

      <button class="cb nav" id="bPrev" aria-label="Înapoi: ecranul anterior"><svg><use href="#i-prev"/></svg><span class="lb-t">Înapoi</span></button>
      <button class="cb nav next" id="bNext" aria-label="Înainte: ecranul următor"><span class="lb-t">Înainte</span><svg><use href="#i-next"/></svg></button>

    <div id="toast" role="status" hidden></div>

      <button class="btn sm skip" id="skip">Sari peste</button>
